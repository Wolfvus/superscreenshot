<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperScreenshot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="logo-wrap">
        <img class="logo" src="icons/icon48.png" alt="" width="32" height="32" />
      </div>
      <div class="head-copy">
        <h1>SuperScreenshot</h1>
      </div>
    </header>

    <div id="warning" class="warning" hidden></div>

    <section class="viewport" aria-labelledby="viewport-label">
      <div class="viewport-top">
        <div>
          <label id="viewport-label" for="device">Capture viewport</label>
          <p>Preview the page at another screen size</p>
        </div>
        <select id="device">
          <option value="desktop">Current window</option>
          <option value="ipad">iPad · 768 × 1024</option>
          <option value="iphone15pro">iPhone 15 Pro · 393 × 852</option>
        </select>
      </div>
    </section>

    <div class="section-label">Choose a capture</div>
    <div class="actions">
      <button id="full" class="btn primary" type="button">
        <span class="action-icon" aria-hidden="true">↕</span>
        <span class="btn-copy">
          <span class="btn-title">Capture full page</span>
          <span class="btn-sub">Scroll and stitch the entire page</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>
      <button id="visible" class="btn" type="button">
        <span class="action-icon" aria-hidden="true">▣</span>
        <span class="btn-copy">
          <span class="btn-title">Visible area</span>
          <span class="btn-sub">Capture only what you can see</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>
    </div>

    <div id="progress" class="progress" role="status" aria-live="polite" hidden>
      <div class="progress-top">
        <span id="progress-label">Capturing…</span>
        <span id="progress-count"></span>
      </div>
      <div class="bar"><div id="bar-fill"></div></div>
      <button id="cancel" class="link" type="button">Cancel</button>
    </div>

    <footer>
      <span class="shield" aria-hidden="true">✓</span>
      <span>Your captures stay on this device</span>
      <p id="shortcuts" class="muted"></p>
    </footer>
    <script src="popup.js" type="module"></script>
  </body>
</html>
