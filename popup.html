<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperScreenshot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img src="icons/icon32.png" alt="" width="24" height="24" />
      <h1>SuperScreenshot</h1>
    </header>
    <p class="intro" data-i18n="captureHint">Capture this tab. Save what matters.</p>

    <div id="warning" class="warning" hidden></div>

    <div class="viewport">
      <label for="device" data-i18n="screenSize">Screen size</label>
      <select id="device">
        <option value="desktop" data-i18n="currentWindow">Current window</option>
        <option value="ipad">iPad · 768 × 1024</option>
        <option value="iphone15pro">iPhone 15 Pro · 393 × 852</option>
      </select>
    </div>

    <div class="actions">
      <button id="full" class="btn primary" type="button" data-i18n="fullPage">
        Full page
      </button>
      <button id="visible" class="btn" type="button" data-i18n="visibleArea">
        Visible area
      </button>
    </div>

    <div id="progress" class="progress" role="status" aria-live="polite" hidden>
      <div class="progress-top">
        <span id="progress-label" data-i18n="capturing">Capturing…</span>
        <span id="progress-count"></span>
      </div>
      <div class="bar"><div id="bar-fill"></div></div>
      <button id="cancel" class="link" type="button" data-i18n="cancel">Cancel</button>
    </div>

    <footer>
      <span data-i18n="privacy">Local PNG. No uploads.</span>
      <p id="shortcuts"></p>
    </footer>
    <script src="popup.js" type="module"></script>
  </body>
</html>
