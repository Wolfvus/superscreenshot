<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperScreenshot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="logo" src="icons/icon48.png" alt="" width="28" height="28" />
      <div>
        <h1>SuperScreenshot</h1>
        <p class="tag">Full-page captures, kept only while you need them.</p>
      </div>
    </header>

    <div id="warning" class="warning" hidden></div>

    <section class="viewport" aria-labelledby="viewport-label">
      <div class="viewport-top">
        <label id="viewport-label" for="device">Viewport</label>
        <select id="device">
          <option value="desktop">Desktop (current window)</option>
          <option value="iphone">iPhone · 390 × 844</option>
          <option value="pixel">Pixel · 412 × 915</option>
          <option value="ipad">iPad · 768 × 1024</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div id="dimensions" class="dimensions" hidden>
        <label>Width <input id="viewport-width" type="number" min="200" max="2000" value="390" inputmode="numeric" /> px</label>
        <label>Height <input id="viewport-height" type="number" min="200" max="3000" value="844" inputmode="numeric" /> px</label>
      </div>
    </section>

    <div class="actions">
      <button id="full" class="btn primary" type="button">
        <span class="btn-title">Capture full page</span>
        <span class="btn-sub">Scroll and stitch everything below the fold</span>
      </button>
      <button id="visible" class="btn" type="button">
        <span class="btn-title">Visible area</span>
        <span class="btn-sub">Just what’s on screen right now</span>
      </button>
    </div>

    <div id="progress" class="progress" hidden>
      <div class="progress-top">
        <span id="progress-label">Capturing…</span>
        <span id="progress-count"></span>
      </div>
      <div class="bar"><div id="bar-fill"></div></div>
      <button id="cancel" class="link" type="button">Cancel</button>
    </div>

    <footer>
      <p id="shortcuts" class="muted"></p>
    </footer>
    <script src="popup.js" type="module"></script>
  </body>
</html>
